/* =========================================================
   THE ARTWORK. Sized in "u" (1/100 of the short side).
   --t scales the text, --m scales the character: when text
   needs room, the character gives way first.
   ========================================================= */
.art, .art * { box-sizing: border-box; }
.art {
  --P: calc(var(--u) * 7); --t: 1; --m: 1;
  --gt: calc(var(--u) * (.45 + .55 * var(--t)));  /* gap unit: shrinks half as fast as the text */ --so: calc(var(--u) * .5);
  --font: "Polin", "Arial Hebrew", Arial, sans-serif;
  position: relative; overflow: hidden; display: grid; direction: rtl;
  padding: var(--P); column-gap: calc(var(--u) * 5); row-gap: calc(var(--u) * 4);
  background: var(--bg); color: var(--fg); font-family: var(--font); font-weight: 400;
}
.media { grid-area: media; position: relative; min-height: 0; min-width: 0; z-index: 0; }
.media > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; object-position: var(--ox, 50%) 100%; }
.media.mirror > img { transform: scaleX(-1); }
.sticker .media > img { filter: drop-shadow(var(--so) 0 0 #fff) drop-shadow(calc(var(--so) * -1) 0 0 #fff) drop-shadow(0 var(--so) 0 #fff) drop-shadow(0 calc(var(--so) * -1) 0 #fff); }

.content { grid-area: content; position: relative; z-index: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; }
.content > * + * { margin-top: calc(var(--gt) * 2.6); }
.content > .hero-box + *, .content > * + .hero-box { margin-top: calc(var(--gt) * 2.4); }
.content > .lead + .flow { margin-top: calc(var(--gt) * 4.6); }
.hero-box { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-end; overflow: hidden; }
/* the opening group (tag, title, subtitle) and, in manual mode, each column */
.lead, .mcol { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.lead { flex: 0 1 auto; }
.art .lead > * + * { margin-top: calc(var(--gt) * 1.9); }
.art .mcol > * + * { margin-top: calc(var(--gt) * 3.2); }
.art .lead > .hero-box + *, .art .lead > * + .hero-box, .art .mcol > .hero-box + *, .art .mcol > * + .hero-box { margin-top: calc(var(--gt) * 2.4); }
.mcol > .cta-wrap, .flow > .cta-wrap { padding-top: calc(var(--gt) * 1.4); }
/* manual arrangement: up to three columns, side by side */
.content.manual { flex-direction: row; align-items: stretch; gap: calc(var(--u) * 6); }
.content.manual > * + * { margin-top: 0; }
.mcol { flex: 1 1 0; justify-content: flex-end; }
.mcol.hero-col { flex-grow: 1.6; }
.l-card .mcol, .l-diag .mcol, .l-paper .mcol, .l-article .mcol, .l-dash .mcol, .l-hero .mcol { justify-content: flex-start; }
.l-frame .mcol { justify-content: center; }
.hero-box > * { width: 100%; }

    url: /^(https?:\/\/)?(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i,
    bullet: /^([•\-\*·▪◦✓✔►–—]|\d{1,2}[.)])\s+/,
    month: new RegExp(`(^|[\\s,|])[בלו]?(${MONTHS})($|[\\s,.|])`),
    time: /\d{1,2}:\d{2}/,
    date: /\d{1,2}[./]\d{1,2}([./]\d{2,4})?/,
    day: /(^|\s)(ב?יום|ימי)\s+(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת|[א-ו]['׳])/,
    place: /(בניין|בבניין|חדר|בחדר|אולם|באולם|רחוב|רח['׳]|קומה|קמפוס|כתובת|מיקום|בית ה|משרדי|מרכז ה|מלון|תל[- ]אביב|ירושלים|חיפה|רמת[- ]גן|הרצליה|באר שבע|פתח תקווה|זום|Zoom)/,
    phone: /0\d{1,2}[-\s]?\d{3}[-\s]?\d{4}|\*\d{4}/,
    email: /\S+@\S+\.\S+/,
    cta: /^(ל(הרשמה|פרטים|רכישה|הזמנה|הזמנות|הורדה|קריאה|צפייה)|הירשמו|הרשמו|הצטרפו|קנו|הזמינו|לחצו|בואו|צרו קשר|הורידו)/,
    small: /^\*|(בכפוף|ט\.ל\.ח|התנאים|כל הזכויות|מספר המקומות מוגבל|ללא תשלום|בהרשמה מראש)/,
    stat: /^([+\-−]?\s?₪?\s?\d[\d,.]*\s?(%|K|M|k|אלף|מיליון|מיליארד)?\+?)\s*[-–—:|·]?\s*(\D.{1,70})$/,
  };
  const isStat = l => { const m = l.match(RX.stat); if (!m) return null; const num = m[1].trim();
    if (/\d[:/]\d/.test(l.slice(0, 10)) || RX.month.test(" " + m[3]) || (/^(19|20)\d\d$/.test(num) && !/%/.test(num))) return null;
    return num + "\n" + m[3].trim(); };
  const isDetail = l => RX.time.test(l) || RX.date.test(l) || RX.day.test(" " + l) || (RX.month.test(" " + l) && /\d/.test(l)) || RX.place.test(l) || RX.phone.test(l) || RX.email.test(l);
  const sentenceJoin = (a, b) => /[.!?:,]$/.test(a) ? a + "\n" + b : a + " " + b;
  function parseContent(raw) {
    const paras = []; let cur = [];
    raw.replace(/\r/g, "").split("\n").map(l => l.replace(/[\t ]+/g, " ").trim()).forEach(l => { if (!l) { if (cur.length) { paras.push(cur); cur = []; } } else cur.push(l); });
    if (cur.length) paras.push(cur);
    const out = []; let link = null, title = false, inSection = false;
    const last = () => out[out.length - 1];
    const push = (type, text, pi) => {
      const L = last();
      if (L && L.pi === pi && L.type === type && (type === "bold" || type === "list")) { L.text += "\n" + text; return; }
      if (L && L.pi === pi && L.type === "body" && type === "body") { L.text = sentenceJoin(L.text, text); return; }
      out.push({ type, text, pi });
    };
    paras.forEach((p, pi) => {
      inSection = false;
      const lastPara = pi === paras.length - 1 && paras.length > 1;
      p.forEach((l, li) => {
        const words = l.split(" ").length;
        if (RX.url.test(l) && !/\s/.test(l)) { link = l.replace(/^https?:\/\//, "").replace(/\/$/, ""); return; }
        if (RX.bullet.test(l)) { push("list", l.replace(RX.bullet, ""), pi); return; }
        if (!title) {
          const next = p[li + 1] || (paras[pi + 1] || [])[0];
          if (!out.length && next && !isDetail(l) && ((l.length <= 34 && /:$/.test(l)) || (words <= 2 && l.length <= 14 && next.length > l.length && !/[.?!]$/.test(next) && next.length <= 70))) { push("tag", l.replace(/:$/, ""), pi); return; }
          if (l.length > 95) { const m = l.match(/^(.{8,80}?[.!?])\s+(.+)$/); if (m) { push("title", m[1].replace(/\.$/, ""), pi); title = true; push("body", m[2], pi); return; } }
          push("title", l, pi); title = true; return;
        }
        if (l.length <= 34 && /:$/.test(l)) { push("section", l.replace(/:$/, ""), pi); inSection = true; return; }
        const st = l.length <= 80 && isStat(l); if (st) { push("stat", st, pi); return; }
        if (l.length <= 28 && RX.cta.test(l)) { push("cta", l, pi); return; }
        if (RX.small.test(l) && l.length <= 160) { push("small", l.replace(/^\*\s*/, ""), pi); return; }
        if (inSection && l.length <= 100) {
          const k = l.indexOf(", ");
          push("item", k > 1 && k <= 32 ? l.slice(0, k) + "\n" + l.slice(k + 2) : l, pi); return;
        }
        if (lastPara && p.length === 1 && out.length >= 4 && l.length <= 140 && !RX.phone.test(l)) { push("small", l, pi); return; }
        if (isDetail(l) && l.length <= 120) { push("bold", l, pi); return; }
        const P = last(); // a short line that continues a block of details belongs to it
        if (P && P.pi === pi && P.type === "bold" && l.length <= 60 && !/[.!?]$/.test(l)) { push("bold", l, pi); return; }
        const L = last();
        if (L && L.type === "title" && l.length <= 95 && !out.some(b => b.type === "sub")) { push("sub", l, pi); return; }
        push("body", l, pi);
      });
    });
    return { blocks: out.map(b => ({ type: b.type, text: b.text })), link };
  }
  function kindOfBlocks(list) {
    const [lead, rest] = splitLead(list);
    if (list.filter(b => b.type === "stat").length >= 2) return "data";
    const chars = rest.reduce((n, b) => n + b.text.length, 0);
    if (chars > 260 || rest.length >= 6) return "long";
    if (chars <= 40 && list.length <= 3) return "little";
    return "medium";
  }
  function candidates(list) {
    const k = kindOfBlocks(list), stats = list.filter(b => b.type === "stat").length, has = t => list.some(b => b.type === t);
    if (k === "data") return stats <= 3 ? ["hero", "dash"] : ["dash", "hero"];
    if (k === "long") return has("section") || has("item") ? ["paper", "article"] : ["article", "paper"];
    if (k === "little") return has("tag") || has("sub") ? ["circle", "big", "diag", "frame"] : ["big", "circle", "diag", "frame"];
    return has("cta") || has("bold") ? ["card", "side", "block"] : ["side", "block", "card"];
  }
  // try each fitting template at the current size and keep the one where everything shows, biggest
  function chooseLayout(list) {
    const f = fmt(), c = colors(), cand = candidates(list); let best = null;
    cand.forEach((id, i) => {
      const a = minis.find(m => m.id === id).art;
      paint(a, id, f, c, false); const { r, hidden } = arrange(a, id, f, c, false);
      const score = (r.overflow ? -9 : 0) + (r.t || 1) - hidden.size * .15 - i * .05;
      if (!best || score > best.score) best = { id, score };
    });
    return best.id;
  }
  const pd = $("#pd"), pdText = $("#pdText");
  let parsed = null;
  function readPaste() {
    parsed = parseContent(pdText.value);
    const list = parsed.blocks;
    $("#pdGo").disabled = !list.length;
    const kindName = { little: "מעט טקסט", medium: "טקסט בינוני", long: "הרבה טקסט", data: "נתונים" }[kindOfBlocks(list)];
    $("#pdKind").hidden = !list.length; $("#pdKind").textContent = "סוג התוכן: " + kindName;
    const col = { tag: ["#FF0354", "#fff"], title: ["#000", "#fff"], sub: ["#5D5C5A", "#fff"], body: ["#E8E7E5", "#000"], bold: ["#C9C9C4", "#000"], list: ["#E8E7E5", "#000"], section: ["#FFE0EA", "#B0003A"], item: ["#F4F4F2", "#000"], stat: ["#3460F6", "#fff"], cta: ["#000", "#FF0354"], small: ["#F4F4F2", "#5D5C5A"] };
    $("#pdRead").innerHTML = list.length
      ? list.map(b => `<div class="pd-row"><span class="tchip" style="background:${col[b.type][0]};color:${col[b.type][1]}">${TYPES[b.type].name}</span><span class="tx">${esc(b.text)}</span></div>`).join("") + (parsed.link ? `<div class="pd-row"><span class="tchip" style="background:#fff;color:#000;border:1px solid #C9C9C4">כתובת אתר</span><span class="tx" dir="ltr">${esc(parsed.link)}</span></div>` : "")
      : `<div class="pd-empty">הדביקו טקסט משמאל, ויופיע כאן איך כל שורה זוהתה: כותרת, פרטים, תוכנייה, נתונים, כפתור…<br>אפשר להדביק ממייל, מוורד או מוואטסאפ.</div>`;
  }
  function openPaste(text) {
    pd.hidden = false;
    if (typeof text === "string") pdText.value = text;
    readPaste(); setTimeout(() => pdText.focus(), 0);
  }
  const closePaste = () => { pd.hidden = true; };
  $("#pasteOpen").addEventListener("click", () => openPaste());
  $("#pdClose").addEventListener("click", closePaste);
  $("#pdCancel").addEventListener("click", closePaste);
  pd.addEventListener("click", e => { if (e.target === pd) closePaste(); });
  pd.addEventListener("keydown", e => { if (e.key === "Escape") closePaste(); if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !$("#pdGo").disabled) $("#pdGo").click(); });
  let readT; pdText.addEventListener("input", () => { clearTimeout(readT); readT = setTimeout(readPaste, 120); });
  $("#pdGo").addEventListener("click", () => {
    if (!parsed || !parsed.blocks.length) return;
    state.blocks = parsed.blocks.map(b => mk(b.type, b.text));
    state.link = parsed.link || "firmabrands.com";
    state.manual = {};
    state.layout = chooseLayout(state.blocks);
    closePaste(); select(null); render(); settle();
    const counts = {}; state.blocks.forEach(b => counts[b.type] = (counts[b.type] || 0) + 1);
    toast(`סודרו ${state.blocks.length} חלקי טקסט בתבנית ״${lay().name}״. ביטול ↶ מחזיר את מה שהיה.`);
  });
  // paste anywhere outside a text field opens the paste window with the text in it
  document.addEventListener("paste", e => {
    const t = e.target;
    if (!pd.hidden || t.isContentEditable || t.tagName === "INPUT" || t.tagName === "TEXTAREA") return;
    const text = e.clipboardData.getData("text/plain");
    if (!text || text.trim().length < 2) return;
    e.preventDefault(); openPaste(text);
  });

  on("#examples", b => { const x = EXAMPLES[+b.dataset.i]; state.blocks = x.blocks.map(([t, v, c]) => mk(t, v, c)); state.layout = x.layout; select(null); render(); settle(); toast(`נטענה הדוגמה ״${x.name}״. ביטול מחזיר את מה שהיה.`); });
  $("#undo").addEventListener("click", () => go(-1));
  $("#redo").addEventListener("click", () => go(1));
  $("#verdict").addEventListener("click", () => { const p = $("#checksPop"); p.hidden = !p.hidden; $("#verdict").setAttribute("aria-expanded", !p.hidden); if (!p.hidden) drawChecks(); else placeMarks(); });
  document.addEventListener("click", e => { if (!$("#checksPop").hidden && !e.target.closest("#checksPop") && !e.target.closest("#verdict") && !e.target.closest(".tool")) { $("#checksPop").hidden = true; placeMarks(); } });
  $("#download").addEventListener("click", exportPNG);
  document.addEventListener("keydown", e => {
    if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== "z") return;
    if (e.target.isContentEditable) return;
    e.preventDefault(); go(e.shiftKey ? 1 : -1);
  });
  new ResizeObserver(() => { scaleMain(); placeTool(); placeMarks(); }).observe(area);
  addEventListener("resize", () => { placeTool(); placeMarks(); });
  updUndo(); render({ noCommit: true });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => render({ noCommit: true }));
})();
</script>
